# Netlify detects Next.js and applies its OpenNext adapter automatically.
# Do not set a publish directory or add secrets here; configure FASHN_API_KEY
# in the Netlify UI (Site configuration > Environment variables).
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Optimized media file names contain a content hash (see
# scripts/optimize-media.mjs), so browsers and the CDN can cache them forever.
[[headers]]
  for = "/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
